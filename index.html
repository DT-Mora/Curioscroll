<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="description" content="CurioScroll: curiosidades reales, una tras otra.">
  <title>CurioScroll</title>
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <main class="app">
    <header class="brand" aria-label="CurioScroll">CurioScroll</header>

    <section class="stage" id="stage" aria-live="polite">
      <article class="curiosity curiosity-card" id="curiosity-current">
        <p class="fact"></p>
        <p class="detail"></p>
        <a class="source" target="_blank" rel="noopener noreferrer"></a>
      </article>

      <article class="curiosity curiosity-card incoming" id="curiosity-incoming" aria-hidden="true">
        <p class="fact"></p>
        <p class="detail"></p>
        <a class="source" target="_blank" rel="noopener noreferrer"></a>
      </article>

      <button class="like" id="like" type="button" aria-label="Me gusta" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.84 8.61c0 5.2-8.84 10.18-8.84 10.18S3.16 13.81 3.16 8.61A4.64 4.64 0 0 1 12 6.06a4.64 4.64 0 0 1 8.84 2.55Z"/>
        </svg>
        <span id="likes">0</span>
      </button>
    </section>

    <div class="gesture" aria-hidden="true">
      <span class="chevron"></span>
      <small>desliza</small>
    </div>
  </main>
  <script src="app.js?v=4" defer></script>
</body>
</html>
